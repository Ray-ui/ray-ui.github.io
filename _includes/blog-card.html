<div class="blog-card">
  <div class="card-content">
    <div class="card-meta">
      <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>
      {% if post.read_time %}
        <span class="read-time"> · {{ post.read_time }} min read</span>
      {% endif %}
    </div>
    <h2 class="card-title">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>
    {% if post.excerpt %}
      <p class="card-excerpt">{{ post.excerpt | strip_html | truncate: 160 }}</p>
    {% endif %}
    <div class="card-tags">
      {% for tag in post.tags limit: 5 %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    <a href="{{ post.url | relative_url }}" class="card-read-more">Read more</a>
  </div>
</div>
